<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Terminal System v1.0</title>
    <style>
        /* Сброс и база */
        * { box-sizing: border-box; }
        body { 
            background-color: #0a0a0c; 
            color: #00ff41; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow-x: hidden;
        }

        /* Эффект старого монитора */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2000;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .main-frame {
            width: 95%;
            max-width: 800px;
            background: #111;
            border: 2px solid #00ff41;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            position: relative;
        }

        header {
            border-bottom: 2px solid #00ff41;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ff41;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .node {
            border: 1px solid #003b00;
            padding: 15px;
            background: rgba(0, 255, 65, 0.02);
            transition: 0.3s;
        }

        .node:hover {
            border-color: #00ff41;
            background: rgba(0, 255, 65, 0.05);
        }

        h3 {
            margin-top: 0;
            color: #fff;
            font-size: 1rem;
            text-transform: uppercase;
        }

        /* Кнопки в стиле терминала */
        .cmd-btn {
            background: transparent;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }

        .cmd-btn:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 15px #00ff41;
        }

        .cmd-btn:active {
            transform: scale(0.95);
        }

        /* Окна логов */
        .terminal-box {
            background: #000;
            border: 1px inset #003b00;
            padding: 12px;
            height: 120px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #00ff41;
            scrollbar-width: thin;
            scrollbar-color: #003b00 #000;
        }

        .terminal-box::-webkit-scrollbar { width: 5px; }
        .terminal-box::-webkit-scrollbar-track { background: #000; }
        .terminal-box::-webkit-scrollbar-thumb { background: #003b00; }

        .status-ok { color: #fff; font-weight: bold; }
        .status-loading { color: #ffae00; }

        /* Курс валют */
        #rateDisplay {
            margin-top: 10px;
        }

        .data-stream {
            border-left: 3px solid #ff003c;
            padding-left: 10px;
            margin: 5px 0;
            background: rgba(255, 0, 60, 0.05);
        }

        small {
            color: #888;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: 1fr 1fr; }
            .node-full { grid-column: span 2; }
        }
    </style>
</head>
<body>



<div class="main-frame">
    <header>
        <h1>System Access: Async_Lab_v8</h1>
        <div style="font-size: 0.7rem;">STATUS: ENCRYPTED // PORT: 8080</div>
    </header>

    <div class="grid">
        <div class="node">
            <h3>[01] Последовательные задачи</h3>
            <button class="cmd-btn" onclick="runSequentialTasks()">Выполнить протокол</button>
            <div id="taskLog" class="terminal-box">READY_TO_START...</div>
        </div>

        <div class="node">
            <h3>[02] JSON_Data_Fetch</h3>
            <button class="cmd-btn" onclick="fetchPosts()">Запросить заголовки</button>
            <div id="postsLog" class="terminal-box">WAITING_FOR_INPUT...</div>
        </div>

        <div class="node node-full">
            <h3>[03] Финансовый поток: Belarusbank_API</h3>
            <button class="cmd-btn" onclick="getExchangeRate()">Получить курс USD</button>
            <div id="rateDisplay" class="terminal-box">DATABASE_IDLE...</div>
        </div>
    </div>
</div>

<script>
    // --- ФУНКЦИОНАЛ ПОЛНОСТЬЮ СОХРАНЕН ---

    function simulateTask(name, delay) {
        return new Promise(resolve => {
            setTimeout(() => {
                console.log(`Завершено: ${name}`);
                resolve(`${name.toUpperCase()} ... [OK]`);
            }, delay);
        });
    }

    async function runSequentialTasks() {
        const log = document.getElementById('taskLog');
        log.innerHTML = "<span class='status-loading'>ИНИЦИАЛИЗАЦИЯ...</span><br>";
        
        const res1 = await simulateTask("Загрузка профиля", 1000);
        log.innerHTML += `> ${res1}<br>`;
        
        const res2 = await simulateTask("Синхронизация базы", 1500);
        log.innerHTML += `> ${res2}<br>`;
        
        const res3 = await simulateTask("Очистка кэша", 800);
        log.innerHTML += `> ${res3}<br>`;
        
        log.innerHTML += "<span class='status-ok'>ПРОЦЕСС ЗАВЕРШЕН.</span>";
    }

    async function fetchPosts() {
        const log = document.getElementById('postsLog');
        log.innerHTML = "<span class='status-loading'>ПОДКЛЮЧЕНИЕ К API...</span><br>";
        try {
            const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');
            const posts = await response.json();
            
            log.innerHTML = "";
            posts.forEach((post, index) => {
                const title = post.title.substring(0, 30) + "...";
                log.innerHTML += `ID:${post.id} | HEADER: ${title}<br>`;
            });
            console.log("Данные получены:", posts);
        } catch (error) {
            log.innerHTML = "ERROR: FAILED_TO_FETCH";
        }
    }

    async function getExchangeRate() {
        const display = document.getElementById('rateDisplay');
        display.innerHTML = "<span class='status-loading'>СКАНИРОВАНИЕ БАНКОВСКИХ ДАННЫХ...</span>";
        
        try {
            const url = 'https://api.allorigins.win/get?url=' + encodeURIComponent('https://belarusbank.by/api/kursExchange');
            const response = await fetch(url);
            const data = await response.json();
            const rates = JSON.parse(data.contents);
            const firstBranch = rates[0]; 
            
            display.innerHTML = `
                <div class="data-stream">
                    CURRENCY: USD<br>
                    BUY_RATE: <span class="status-ok">${firstBranch.USD_in}</span><br>
                    SELL_RATE: <span class="status-ok">${firstBranch.USD_out}</span><br>
                    BRANCH: ${firstBranch.filials_text.substring(0, 50)}...
                </div>
            `;
        } catch (error) {
            display.innerHTML = "<span style='color:#ff003c'>ACCESS DENIED: CORS_ERROR</span>";
            console.error(error);
        }
    }
</script>

</body>
</html>
