<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Lab 8</title>
    <style>
        /* Базовые стили [cite: 8-10] */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Навигационная панель с рабочими кнопками  */
        .navbar { width: 100%; background: #333; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-sizing: border-box; }
        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        .nav-links li a { color: white; text-decoration: none; font-weight: bold; cursor: pointer; }
        .nav-links li a:hover { color: #5cb85c; }

        /* Бургер-меню для мобильных [cite: 32-33] */
        .burger { display: none; cursor: pointer; flex-direction: column; gap: 5px; }
        .burger div { width: 25px; height: 3px; background: white; transition: 0.3s; }

        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; margin-top: 30px; }
        h1 { text-align: center; color: #333; }
        
        /* Поле ввода и кнопка [cite: 10-12] */
        .input-section { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        #addTaskBtn { background-color: #5cb85c; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; }

        /* Секция фильтрации [cite: 24-25] */
        .filter-section { display: flex; gap: 5px; margin-bottom: 20px; }
        .filter-btn { flex: 1; padding: 8px; border: 1px solid #ddd; background: #eee; cursor: pointer; border-radius: 4px; }
        .filter-btn.active { background: #333; color: white; }

        /* Список задач [cite: 13-15] */
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; margin-bottom: 8px; border-radius: 4px; }
        
        /* Стили для выполненной задачи  */
        .task-text { flex: 1; cursor: pointer; }
        .completed .task-text { text-decoration: line-through; color: #888; }
        
        .delete-btn { background: #d9534f; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        /* Адаптивность [cite: 32] */
        @media (max-width: 600px) {
            .burger { display: flex; }
            .nav-links { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background: #333; padding: 20px; box-sizing: border-box; }
            .nav-links.show { display: flex; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><strong>Мой Планнер</strong></div>
        <ul class="nav-links" id="navLinks">
            <li><a href="../index.html" onclick="alert('Переход на Главную')">Главная</a></li>
            <li><a href="../business_card/index.html" onclick="alert('Профиля')">Профиль</a></li>
        </ul>
        <div class="burger" id="burger">
            <div></div><div></div><div></div>
        </div>
    </nav>

    <div class="container">
        <h1>Список задач</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Что нужно сделать?">
            <button id="addTaskBtn">Добавить</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
            <button class="filter-btn" data-filter="uncompleted">Невыполненные</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        // Данные и хранилище [cite: 17]
        let tasks = JSON.parse(localStorage.getItem('tasksList')) || [];
        let currentFilter = 'all';

        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');

        // 1. Бургер-меню (переключение вида) 
        document.getElementById('burger').onclick = () => {
            document.getElementById('navLinks').classList.toggle('show');
        };

        // 2. Функция отрисовки списка [cite: 4]
        function render() {
            taskList.innerHTML = '';
            localStorage.setItem('tasksList', JSON.stringify(tasks));

            const filtered = tasks.filter(t => {
                if (currentFilter === 'completed') return t.done;
                if (currentFilter === 'uncompleted') return !t.done;
                return true;
            });

            filtered.forEach(task => {
                const li = document.createElement('li');
                if (task.done) li.classList.add('completed');

                // Текст задачи (клик по нему отмечает выполнение) 
                const span = document.createElement('span');
                span.className = 'task-text';
                span.textContent = task.text;
                span.onclick = () => toggleTask(task.id);

                // Кнопка удаления [cite: 15]
                const btn = document.createElement('button');
                btn.className = 'delete-btn';
                btn.textContent = 'Удалить';
                btn.onclick = () => deleteTask(task.id);

                li.appendChild(span);
                li.appendChild(btn);
                taskList.appendChild(li);
            });
        }

        // 3. Добавление задачи (проверка на пустоту) [cite: 37]
        addTaskBtn.onclick = () => {
            const val = taskInput.value.trim();
            if (!val) return alert("Введите текст задачи!");
            
            tasks.push({ id: Date.now(), text: val, done: false });
            taskInput.value = '';
            render();
        };

        // 4. Отметка выполнения [cite: 3]
        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? {...t, done: !t.done} : t);
            render();
        }

        // 5. Удаление [cite: 3]
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            render();
        }

        // 6. Логика фильтров [cite: 19-23]
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelector('.filter-btn.active').classList.remove('active');
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                render();
            };
        });

        // Запуск при загрузке
        render();
    </script>
</body>
</html>
